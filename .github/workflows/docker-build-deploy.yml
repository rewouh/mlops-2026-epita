name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'TP1-embedding-a-model/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push docker images
        uses: docker/build-push-action@v5
        with:
          context: ./TP1-embedding-a-model
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mlops-house-prediction:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mlops-house-prediction:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/mlops-house-prediction:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/mlops-house-prediction:buildcache,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            docker stop mlops-house-prediction || true
            docker rm mlops-house-prediction || true
            
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mlops-house-prediction:latest
            
            docker run -d \
              --name mlops-house-prediction \
              --restart unless-stopped \
              -p 7612:7612 \
              ${{ secrets.DOCKERHUB_USERNAME }}/mlops-house-prediction:latest
            
            docker image prune -f
